[workspace]
resolver = "2"
members = [
    "crates/rphp-span",
    "crates/rphp-source",
    "crates/rphp-diagnostics",
    "crates/rphp-intern",
    "crates/rphp-value",
    "crates/rphp-ast",
    "crates/rphp-lexer",
    "crates/rphp-bytecode",
    "crates/rphp-parser",
    "crates/rphp-compiler",
    "crates/rphp-stdlib",
    "crates/rphp-runtime",
    "crates/rphp-sapi-cli",
    "crates/rphp-sapi-server",
    "crates/rphp-sapi-fcgi",
    "crates/rphp-ext-pdo",
    "crates/rphp-ext-dom",
    "crates/rphp-ext-intl",
    "crates/rphp-ext-api",
    "crates/rphp-test",
    "crates/rphp-tokenizer",
    "crates/rphp-embed",
    "crates/rphp-hir",
    "crates/rphp-pcre2",
    "tools/rphp",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drietsch/rphp"
authors = ["Dietmar Rietsch <dietmar.rietsch@andthenext.at>"]
rust-version = "1.97"

# Internal crates, referenced by path so the whole graph builds from source.
[workspace.dependencies]
rphp-span = { path = "crates/rphp-span" }
rphp-source = { path = "crates/rphp-source" }
rphp-diagnostics = { path = "crates/rphp-diagnostics" }
rphp-intern = { path = "crates/rphp-intern" }
rphp-value = { path = "crates/rphp-value" }
rphp-ast = { path = "crates/rphp-ast" }
rphp-lexer = { path = "crates/rphp-lexer" }
rphp-bytecode = { path = "crates/rphp-bytecode" }
rphp-parser = { path = "crates/rphp-parser" }
rphp-compiler = { path = "crates/rphp-compiler" }
rphp-stdlib = { path = "crates/rphp-stdlib" }
rphp-runtime = { path = "crates/rphp-runtime" }
rphp-sapi-cli = { path = "crates/rphp-sapi-cli" }
rphp-sapi-server = { path = "crates/rphp-sapi-server" }
rphp-sapi-fcgi = { path = "crates/rphp-sapi-fcgi" }
rphp-ext-pdo = { path = "crates/rphp-ext-pdo" }
rphp-ext-dom = { path = "crates/rphp-ext-dom" }
rphp-ext-intl = { path = "crates/rphp-ext-intl" }
rphp-ext-api = { path = "crates/rphp-ext-api" }
rphp-test = { path = "crates/rphp-test" }
rphp-tokenizer = { path = "crates/rphp-tokenizer" }
rphp-embed = { path = "crates/rphp-embed" }
rphp-hir = { path = "crates/rphp-hir" }
rphp-pcre2 = { path = "crates/rphp-pcre2" }

# External crates. Versions are pinned here once; member crates use
# `{ workspace = true }` so the whole workspace agrees on one version.
# Front end (ADR-025): the mago crates are pinned exactly and bumped deliberately.
mago-syntax = "=1.49.0"
mago-allocator = "=1.49.0"
mago-database = "=1.49.0"
mago-span = "=1.49.0"
# The process allocator of the binaries: the engine allocates a heap
# object per string/array/object (no unsafe DSTs), and the system
# allocator on macOS is a large share of a request's time.
mimalloc = { version = "0.1", default-features = false }
# Tooling / tests.
rayon = "1.12"
regex = "1.13"
tempfile = "3.27"
walkdir = "2.5"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
insta = "1.48"
pico-args = "0.5"
memchr = "2.8"
# The hash tables behind arrays, object layouts and the class/function
# indexes: hashbrown's foldhash is several times faster than std's SipHash
# on the short byte keys php code hashes all day.
hashbrown = "0.16"
sha2 = "0.10"
# date extension (S6): civil/zoned datetime arithmetic and the tz database.
jiff = "0.2"
jiff-tzdb = "0.1"
# mbstring/iconv (ADR-032): legacy CJK double-byte tables.
encoding_rs = "0.8.41"
# pcre extension (ADR-032): PCRE2 itself, through the raw `-sys` bindings; the
# safe surface lives in crates/rphp-pcre2.
pcre2-sys = "0.2.10"
# password / crypt (S9): `pwhash` carries the traditional unix schemes php's
# `crypt()` still answers for (DES, `$1$`, `$5$`, `$6$`, bcrypt); `argon2` is
# RustCrypto's, byte-compatible with the libargon2 php links.
# The platform boundaries the stdlib needs where std has no API: `umask()`,
# `poll(2)` behind `stream_select()`, `uname()` behind `gethostname()`, and
# the one-byte `MSG_PEEK` php's `feof()` uses to tell a quiet socket from a
# closed one. `rustix` wraps them safely, keeping `#![forbid(unsafe_code)]`
# intact.
rustix = { version = "1", features = ["fs", "process", "termios", "event", "system", "net"] }
pwhash = "1"
# PDO (S14, ADR-035): SQLite compiled in (`bundled`), with user-defined
# functions, collations and declared column types for `pdo_sqlite`.
rusqlite = { version = "0.40", features = ["bundled", "functions", "collation", "column_decltype", "column_metadata", "load_extension"] }
argon2 = "0.5"
password-hash = "0.5"
# intl (ADR-037): ICU4X with its data compiled in — the collator, normalizer,
# segmenter, decimal/datetime/list/plural formatters, locale canonicalization,
# character properties and the CLDR transliteration rules php's ext/intl
# answers for through ICU. `icu_experimental` carries the display names,
# currency data and transliterator; `idna` the UTS #46 processing behind
# `idn_to_ascii()`; `unicode_names2` the character names `IntlChar` lists.
icu = { version = "2.3", features = ["compiled_data", "unstable"] }
icu_experimental = { version = "0.6", features = ["compiled_data"] }
icu_provider = "2.3"
tinystr = "0.8"
fixed_decimal = "0.7"
writeable = "0.6"
idna = "1.1"
unicode_names2 = "2"

# Dependencies are compiled with optimization even in a dev build: the crypto
# and regex crates are the slow part of the test suite, and an unoptimized
# bcrypt/argon2 takes minutes where php takes a second. Our own crates stay
# unoptimized so backtraces and debug builds keep their meaning.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
