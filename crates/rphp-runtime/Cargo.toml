[package]
name = "rphp-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Count the ops each function executes and print the top of the table at
# request end (`RPHP_PROFILE` is not consulted: a feature keeps the
# counter out of the release binary's hot loop).
profile = []

[dependencies]
hashbrown.workspace = true
jiff.workspace = true
rphp-bytecode.workspace = true
rphp-value.workspace = true
rphp-ext-api.workspace = true

[dev-dependencies]
# Needed only by tests to construct `Function { name, span, .. }` by hand.
rphp-intern.workspace = true
rphp-span.workspace = true
