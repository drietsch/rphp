[package]
name = "rphp-sapi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forwarded to the runtime: per-function op counts at request end.
profile = ["rphp-embed/profile"]

[dependencies]
# Running goes through rphp-embed only (ADR-014); the front-end crates are
# used directly by the `--emit=tokens|ast` dumps and `-l`.
rphp-embed.workspace = true
rphp-sapi-server.workspace = true
rphp-sapi-fcgi.workspace = true
rphp-source.workspace = true
rphp-hir.workspace = true
rphp-span.workspace = true
rphp-intern.workspace = true
rphp-ast.workspace = true
rphp-parser.workspace = true
rphp-tokenizer.workspace = true
