# Divergence allowlist for the tier-A differential oracle (ADR-008).
#
# Every entry documents output that legitimately differs between stock php and
# rphp, names one category from the CLOSED set and cites why. Entries apply
# their normalizer to BOTH sides of every channel (stdout, stderr) before the
# comparison; the exit code is always compared exactly and can never be
# allowlisted. An entry that matches no snippet fails the suite (stale entry).
#
# Schema:
#   [[allow]]
#   snippet   = "<ext>/<topic>.php"   # relative path or glob: `*` within a
#                                     # segment, `**` across segments, `?` one char
#   category  = "<category>"          # float-format | locale | error-wording |
#                                     # hash-order | platform-value | resource-id |
#                                     # object-id | tzdb-version | pid | timing |
#                                     # tempnam-path | path
#   reason    = "why this legitimately diverges"
#   normalize = ""                    # "" = the category's default normalizer,
#                                     # "drop-lines:<regex>" drops matching lines,
#                                     # "regex:<pattern> => <replacement>" rewrites
#                                     # ($1 references work); locale, platform-value
#                                     # and pid have no default and need a rule.
#
# Example (not active):
#   [[allow]]
#   snippet   = "spl/object-id.php"
#   category  = "object-id"
#   reason    = "var_dump prints the object handle; handles depend on allocation order"
#   normalize = ""

[[allow]]
snippet   = "lang/closure-identity.php"
category  = "object-id"
reason    = "the snippet dumps short-lived closures beside the objects an expression makes; freed handles are reused on both sides, but the temporaries of one expression die in a different order here, so a handle is sometimes reused one object later"
normalize = ""

[[allow]]
snippet   = "lang/include.php"
category  = "platform-value"
reason    = "the include_path in php's 'Failed opening' warning is the build's default (`.:/opt/homebrew/.../pear` for the Homebrew oracle, `.:/usr/share/php` for rphp's core ini defaults)"
normalize = "regex:include_path='[^']*' => include_path='<default>'"

[[allow]]
snippet   = "date/period.php"
category  = "object-id"
reason    = "DatePeriod builds its start/interval objects in a different order from php, so the handles a dump shows are permuted"
normalize = ""

[[allow]]
snippet   = "reflection/lazy-objects.php"
category  = "object-id"
reason    = "var_dump prints the handle of every lazy object; the initializer closures and the temporaries die in a different order here, so a few handles are reused one object later"
normalize = ""

[[allow]]
snippet   = "pdo/sqlite*.php"
category  = "object-id"
reason    = "the fetch-mode probes dump the objects every fetch builds; the statement's temporaries die in a different order here, so the handles are permuted"
normalize = ""

[[allow]]
snippet   = "dom/*.php"
category  = "object-id"
reason    = "the DOM probes dump node objects made on the fly; php frees a node wrapper as soon as the expression is done with it, while the engine keeps some alive to the end of the statement, so the handles are permuted"
normalize = ""
