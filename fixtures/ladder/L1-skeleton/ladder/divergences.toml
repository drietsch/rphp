# Divergence allowlist for the L1-skeleton fixture (ADR-034: closed set of
# categories, loaded by rphp-test's `Allowlist` — strict: unknown keys or
# categories, empty reasons and defaultless categories without a `normalize`
# rule are rejected).
#
# Entry names are `<rung id>/<command line>` exactly as written in ladder.toml;
# globs work (`*` within a `/`-segment, `**` across). Every normalizer runs over
# BOTH sides, so everything a rule does not touch is still compared byte-exact.
# Nothing here is needed for L1 or L3: their output is fully deterministic.

# `bin/console about` (L6a) — the lines that depend on the host rather than on
# the engine. Only the volatile span is replaced; the labels, Symfony's own
# version line, the kernel section, `PHP > Version` (rphp must report 8.5.0)
# and `Architecture` stay under comparison.

[[allow]]
snippet   = "L6a/bin/console about*"
category  = "platform-value"
reason    = "End of maintenance / End of life print `(in +N days)` relative to today's date"
normalize = 'regex:(?m)^(\s{2}End of (?:maintenance|life)\s+\S+ )\([^)]*\)\s*$ => $1(%WHEN%)'

[[allow]]
snippet   = "L6a/bin/console about*"
category  = "platform-value"
reason    = "Cache/Build/Share/Log directory lines print the directory size, which counts .meta/log files that are not artifacts of the rung"
normalize = 'regex:(?m)^(\s{2}(?:Cache|Build|Share|Log) directory\s+\S+ )\([^)]*\)\s*$ => $1(%SIZE%)'

[[allow]]
snippet   = "L6a/bin/console about*"
category  = "platform-value"
reason    = "Timezone prints the current timestamp next to the zone name"
normalize = 'regex:(?m)^(\s{2}Timezone\s+\S+ )\([^)]*\)\s*$ => $1(%NOW%)'

[[allow]]
snippet   = "L6a/bin/console about*"
category  = "platform-value"
reason    = "OPcache/APCu/Xdebug/Intl locale describe the host php build's extensions, not engine behaviour"
normalize = 'drop-lines:^\s{2}(?:OPcache|APCu|Xdebug|Intl locale)\s'

# L7 (HTTP) — what Symfony's own pages randomize or time-stamp. The port and
# the `Date` header are placeholders already (the ladder replaces both).

[[allow]]
snippet   = "L7/**"
category  = "platform-value"
reason    = "the welcome page picks its colour hue with random_int()"
normalize = 'regex:--hue: \d+; => --hue: %HUE%;'

[[allow]]
snippet   = "L7/**"
category  = "platform-value"
reason    = "VarDumper numbers each HTML dump with mt_rand(), in the script and the element ids"
normalize = 'regex:sf-dump-\d+ => sf-dump-%N%'

[[allow]]
snippet   = "L7/**"
category  = "object-id"
reason    = "the debug page prints spl_object_id() next to dumped objects; php reuses freed handles, the engine's allocator is monotonic"
normalize = 'regex:class=sf-dump-ref>#\d+</a> => class=sf-dump-ref>#%ID%</a>'

[[allow]]
snippet   = "L7/**"
category  = "timing"
reason    = "the exception page prints the request's wall-clock time"
normalize = 'regex:<span class="text-muted newline">\d\d:\d\d:\d\d</span> => <span class="text-muted newline">%TIME%</span>'
