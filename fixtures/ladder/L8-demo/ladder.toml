# Ladder rungs served by this fixture (symfony/demo, the reference
# application: Doctrine ORM over SQLite, Twig, security, forms, translations,
# the web profiler). Executed by `cargo xtask ladder --rung <id>`; schema and
# execution model: fixtures/ladder/README.md.

[fixture]
name = "L8-demo"
setup = "composer install --no-interaction --no-progress --prefer-dist && bin/console sass:build"
php_min = "8.4.1"
allowlist = "ladder/divergences.toml"
# The pages need the compiled stylesheet (`bin/console sass:build`, which
# downloads dart-sass into var/); the working copy keeps it.
var_keep = ["sass"]

[[rung]]
id = "L8"
title = "symfony/demo: container compiled, console booted"
env = { COLUMNS = "120", LINES = "50" }
commands = [
  # Boots the kernel and compiles the whole demo container (Doctrine, Twig,
  # security, translator, profiler…); the host-dependent lines are
  # normalized by ladder/divergences.toml.
  "bin/console about --no-ansi",
  "bin/console debug:router --no-ansi",
  "bin/console lint:container --no-ansi",
]

[[rung]]
id = "L8http"
title = "symfony/demo over HTTP (rphp -S vs php -S): the blog, a post, search, feeds, login, 404"
http = true
docroot = "public"
requests = [
  "GET /",
  "GET /en/blog/",
  "GET /en/blog/page/2",
  "GET /en/blog/posts/lorem-ipsum-dolor-sit-amet-consectetur-adipiscing-elit",
  "GET /en/blog/search?q=lorem",
  "GET /en/blog/rss.xml",
  "GET /de/blog/",
  "GET /en/login",
  "GET /en/blog/posts/nope",
  "GET /nonexistent",
]

[[rung]]
id = "L8http-flow"
title = "symfony/demo, the stateful walk: login, a post created with tags, a comment, the post edited and deleted, logout, the profile, search"
http = true
docroot = "public"
# Each side keeps its cookies (the session), sends the same-origin header
# the demo's stateless CSRF wants on every POST, and quotes the delete
# form's session-bound token. The fixture database has 30 posts, so the
# new one is 31 on both sides.
cookies = true
# The comment the walk posts carries the moment it was posted, so the two
# sides — which run one after the other — write different minutes into the
# rendered page. Everything else in it still has to match byte for byte.
mask = ['commented on\s*<strong>([^<]*)</strong>']
requests = [
  "GET /en/login",
  "POST /en/login _username=jane_admin&_password=kitten&_csrf_token=csrf-token",
  "GET /en/admin/post/",
  "GET /en/admin/post/new",
  "POST /en/admin/post/new post[title]=Walk+post&post[summary]=A+summary+from+the+walk&post[content]=Some+**markdown**+content+with+a+[link](http://example.com)+and+<script>alert(1)</script>.&post[publishedAt]=2026-09-21+10:00&post[tags]=walk,test&post[_token]=csrf-token",
  "GET /en/admin/post/",
  "GET /en/blog/posts/walk-post",
  "POST /en/blog/comment/walk-post/new comment[content]=A+comment+from+the+walk&comment[_token]=csrf-token",
  "GET /en/blog/posts/walk-post",
  "GET /en/admin/post/31/edit",
  "POST /en/admin/post/31/edit post[title]=Walk+post+(edited)&post[summary]=A+summary+from+the+walk&post[content]=Edited+content.&post[publishedAt]=2026-09-21+10:00&post[tags]=walk&post[_token]=csrf-token",
  "GET /en/admin/post/31",
  "POST /en/admin/post/31/delete token=${input:token}",
  "GET /en/admin/post/",
  "GET /en/profile/edit",
  "GET /en/blog/search?q=walk",
  "GET /en/logout",
  "GET /en/admin/post/",
]
