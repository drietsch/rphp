# Pinned nightly toolchain (ADR-013, bumped per ADR-028): the pin tracks the
# MSRV of `mago-syntax` (rust-version 1.97) and keeps `become`
# (explicit_tail_calls) available for the threaded-dispatch feature. The
# portable `loop { match }` core is the default, so the workspace also compiles
# on stable; pinning nightly makes the `become` path reproducible.
[toolchain]
channel = "nightly-2026-09-01"
components = ["rustfmt", "clippy"]
