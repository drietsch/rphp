[package]
name = "rphp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rphp"
path = "src/main.rs"

[features]
# Forwarded to the runtime: per-function op counts at request end.
profile = ["rphp-sapi-cli/profile"]

[dependencies]
rphp-sapi-cli.workspace = true
mimalloc.workspace = true

[dev-dependencies]
rphp-test.workspace = true
# `tests/tls.rs` stands a TLS server of its own on loopback, so the
# transports can be tested without reaching past the machine.
rustls.workspace = true
rustls-pemfile.workspace = true
